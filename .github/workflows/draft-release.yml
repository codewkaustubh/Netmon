name: Build and create draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create the release for (e.g. v1.0.0)'
        required: true
      release_name:
        description: 'Optional release name'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          # Set cache to false if your project does not have a go.sum file
          cache: false

      - name: Resolve tag and release name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TITLE="${{ github.event.inputs.release_name }}"
          else
            TAG="${{ github.ref_name }}"
            TITLE=""
          fi

          if [ -z "$TAG" ]; then
            echo "Error: Tag is not set."
            exit 1
          fi

          if [ -z "$TITLE" ]; then
            TITLE="$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          PKG=./
          for OS in linux darwin windows; do
            for ARCH in amd64 arm64; do
              BIN_NAME=netmon-${OS}-${ARCH}
              EXT=""
              if [ "$OS" = "windows" ]; then EXT=".exe"; fi
              echo "Building ${BIN_NAME}${EXT}"
              GOOS=$OS GOARCH=$ARCH go build -ldflags "-s -w" -o dist/${BIN_NAME}${EXT} $PKG
              if [ "$OS" != "windows" ]; then chmod +x dist/${BIN_NAME}${EXT}; fi
            done
          done

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          TITLE: ${{ steps.vars.outputs.title }}
        run: |
          gh release create "$TAG" dist/* \
            --draft \
            --title "$TITLE" \
            --notes "Draft release created by GitHub Actions (built binaries are attached)."